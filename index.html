<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualang Hayati</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#d9f1ff;--bg2:#bfe8c9;--panel:#fff;--ink:#1c2152;--mut:#5b6296;--line:#c9d3f2;--acc:#2fa36b;--accd:#1e7a4e;--gold:#f2b134;--red:#e0475b;--redd:#a92d40;--sky:#4aa8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141844;--bg2:#17384a;--panel:#232a6b;--ink:#f1f3ff;--mut:#aab2ee;--line:#3a44a0;--acc:#4fd28d;--accd:#2c9d62;--gold:#ffc857;--red:#ff6b7f;--redd:#c9455a;--sky:#7cc6f2}}
:root[data-theme="dark"]{--bg:#141844;--bg2:#17384a;--panel:#232a6b;--ink:#f1f3ff;--mut:#aab2ee;--line:#3a44a0;--acc:#4fd28d;--accd:#2c9d62;--gold:#ffc857;--red:#ff6b7f;--redd:#c9455a;--sky:#7cc6f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:500 17px/1.4 "Baloo 2",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:clamp(40px,10vw,68px);line-height:1;margin:.2em 0;font-weight:800;letter-spacing:-.01em}
h2{margin:.2em 0;font-size:26px;font-weight:800}
p{margin:.4em 0}
small{color:var(--mut);font-size:14px}
.btn{background:var(--acc);color:#fff;border:0;border-bottom:4px solid var(--accd);border-radius:14px;padding:8px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.btn.gold{background:var(--gold);color:#3a2a00;border-bottom-color:#b9801a}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 14px;margin-bottom:14px}
.me{display:flex;align-items:center;gap:10px;line-height:1.1}
.av{font-size:38px;position:relative}.av small{position:absolute;right:-14px;bottom:-4px;font-size:22px}
.xp{flex:1;min-width:80px}
.coin{font-weight:800;color:var(--ink)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);transition:width .5s}
.bar.hp i{background:var(--acc)}.f.mon .bar.hp i{background:var(--red)}
.zones{display:grid;gap:12px}
.zone{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px 8px 20px 8px;padding:12px 16px;font:inherit;cursor:pointer}
.zone:disabled{opacity:.6;cursor:not-allowed}
.zone .em{font-size:52px;text-align:center}
.zone b{font-size:21px;font-weight:800}
.zone .bar{margin-top:6px;height:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero{text-align:center;padding:24px 0 8px}
.avs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.avs button{font-size:38px;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:2px 10px;cursor:pointer}
.avs button[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--panel))}
input{font:inherit;font-weight:700;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:min(320px,100%);text-align:center}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-bottom:12px}
.f{text-align:center}.f .em{font-size:clamp(56px,16vw,92px);line-height:1}
.f b{display:block;font-size:15px}
.vs{font-weight:800;color:var(--mut);padding-bottom:30px}
.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg)}50%{transform:translateX(8px) rotate(4deg)}80%{transform:translateX(-4px)}}
.qc{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px}
.q{font-size:19px;font-weight:700;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer}
.opt kbd{font:inherit;font-weight:800;color:var(--mut);margin-right:6px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--panel))}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 22%,var(--panel))}
#fb{margin-top:12px;font-weight:700}
.end{text-align:center}.end .em{font-size:84px}
.miss{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.miss small{display:block}
.up{background:var(--gold);color:#3a2a00;font-weight:800;border-radius:14px;padding:8px;margin:10px 0}
.shop{display:grid;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 14px}
.item .em{font-size:40px}.item div{flex:1}
a{color:var(--sky);font-weight:700}a.btn{text-decoration:none;display:inline-block}
.tw{overflow-x:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px}.card b{display:block;font-size:26px;line-height:1.1}.ko{color:var(--red);font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const show=h=>{app.innerHTML=h;app.style.maxWidth="";window.scrollTo(0,0)};
const hud=()=>`<div class="hud"><div class="me"><span class="av">${S.av}${S.pet?`<small>${S.pet}</small>`:""}</span><div><b>${esc(S.name)}</b><br><small>Level ${S.lv}</small></div></div><div class="xp"><div class="bar" aria-hidden="true"><i style="width:${S.xp/need(S.lv)*100}%"></i></div><small>${S.xp} dari ${need(S.lv)} XP</small></div><div class="xp"><div class="bar hp" aria-hidden="true"><i id="hh" style="width:${S.hp}%"></i></div><small>❤️ <span id="hv">${S.hp}</span> dari 100 HP</small></div><div class="coin">🪙 ${S.coins}</div></div>`;

function title(){show(`<div class="hero"><div style="font-size:64px">🌿🦋🍄</div><h1>Petualang Hayati</h1><p>Projek IPAS untuk siswa SMK kelas 10</p><p><small>Jawab soal dengan benar untuk menyerang monster. Jawab salah, dan kamu terkena serangan balik.</small></p>
<div class="avs" role="group" aria-label="Pilih karakter">${AVS.map(a=>`<button data-act="av" data-a="${a}" aria-pressed="${a===tmpAv}">${a}</button>`).join("")}</div>
<p><label for="nm"><small>Nama petualang</small></label><br><input id="nm" maxlength="14" placeholder="Tulis namamu"></p>
<p><button class="btn" data-act="start">Mulai petualangan</button></p><p><a href="#guru"><small>Dasbor guru</small></a></p></div>`)}

function map(){sure=false;const t=ZONES.map((z,k)=>{const ids=Q.map((q,i)=>i).filter(i=>Q[i].z===z.z),m=ids.filter(i=>S.st[i]&&S.st[i].c>0).length,lock=S.lv<z.lv,ko=S.hp<=0;
return `<button class="zone" data-act="fight" data-k="${k}" ${lock||ko?"disabled":""}><span class="em">${lock?"🔒":z.e}</span><span><b>${z.n}</b><br><small>${lock?"Terbuka di level "+z.lv:z.d}</small><span class="bar" style="display:block"><i style="width:${m/ids.length*100}%"></i></span><small>${m} dari ${ids.length} soal dikuasai, ${S.w[z.z]||0} monster dikalahkan</small></span></button>`}).join("");
show(`${hud()}<h2>Peta petualangan</h2>${S.hp<=0?`<div class="up" style="background:var(--red);color:#fff">Kamu pingsan! Gunakan Revive di toko untuk bangun kembali.</div>`:S.hp<35?`<p><small>HP-mu rendah. Pakai Potion di toko sebelum bertarung.</small></p>`:""}<div class="zones">${t}</div><div class="row"><button class="btn gold" data-act="shop">Toko</button><button class="btn alt" data-act="reset">Mulai dari awal</button><a class="btn alt" href="#guru">Dasbor guru</a></div>`)}

let DB=null,UID=null,sT=null,sBusy=false,dirty=false,cnt=false,unsub=null,tm=null,LR=[],LP={};
function sync(){if(!DB)return;dirty=true;clearTimeout(sT);sT=setTimeout(push,1200)}
async function push(){if(!DB||!S||!S.st||sBusy)return;sBusy=true;dirty=false;try{const t=Object.values(S.st),n=f=>t.reduce((a,x)=>a+(x[f]||0),0);
await DB.doc("players/"+UID).set({nama:S.name,av:S.av,lv:S.lv,hp:S.hp,pot:S.pot||0,rev:S.rev||0,pet:S.pet||"",koin:S.coins,lg:S.lg||0,bt:S.bt||0,wn:Object.values(S.w).reduce((a,b)=>a+b,0),dt:S.dt||0,ok:n("c"),no:n("w"),aks:Date.now()})}catch(e){}sBusy=false;if(dirty)sync()}
function hello(){if(cnt||!DB||!S||!S.st)return;cnt=true;S.lg=(S.lg||0)+1;save()}
(async()=>{try{const u=await claude.use("user"),d=await claude.use("db");if(u&&d){UID=await u.id();if(UID){DB=d;hello()}}}catch(e){}})();
const fmt=t=>t?new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const g=(x,k)=>x[k]||0;
const back='<p><a class="btn alt" href="#main">Kembali ke game</a></p>';
function guru(){show(`<h2>Dasbor guru</h2><p><small>Memuat data pemain...</small></p>${back}`);
(async()=>{let d=null,u=null;try{d=await claude.use("db");u=await claude.use("user")}catch(e){}
const can=u?await u.canEdit():false;
if(!d||!can){show(`<h2>Dasbor guru</h2><p>${d?"Dasbor ini hanya bisa dibuka oleh guru (Editor atau Owner halaman).":"Dasbor belum tersedia. Buka halaman ini setelah masuk ke akun Claude."}</p>${back}`);return}
tm=setTimeout(()=>show(`<h2>Dasbor guru</h2><p>Data belum masuk. Coba muat ulang halaman.</p>${back}`),10000);
unsub=d.collection("players").onSnapshot(async s=>{clearTimeout(tm);const r=s.docs.map(x=>({id:x.id,...x.data()}));let ps={};try{ps=await u.profiles(r.map(x=>x.id))}catch(e){}if(location.hash==="#guru")board(r,ps)},e=>{clearTimeout(tm);show(`<h2>Dasbor guru</h2><p>Data tidak bisa dibaca saat ini.</p>${back}`)});
if(location.hash!=="#guru"){unsub();unsub=null}})()}
function board(r,ps){LR=r;LP=ps;r.sort((a,b)=>g(b,"aks")-g(a,"aks"));
const sum=k=>r.reduce((a,x)=>a+g(x,k),0),ok=sum("ok"),no=sum("no");
const cd=[["Pemain",r.length],["Total login",sum("lg")],["Pertarungan",sum("bt")],["Monster kalah",sum("wn")],["Kali pingsan",sum("dt")],["Sedang pingsan",r.filter(x=>g(x,"hp")<=0).length],["Akurasi kelas",ok+no?Math.round(ok/(ok+no)*100)+"%":"-"]];
const rows=r.map(x=>{const a=g(x,"ok")+g(x,"no"),acc=a?Math.round(g(x,"ok")/a*100)+"%":"-",on=Date.now()-g(x,"aks")<3e5,hp=g(x,"hp");
return `<tr><td>${esc((ps[x.id]&&ps[x.id].name)||"-")}</td><td>${esc(x.av||"")} ${esc(x.nama||"")}</td><td>${g(x,"lv")}</td><td><span class="bar hp" style="display:inline-block;width:60px;vertical-align:middle"><i style="width:${hp}%"></i></span> <span class="${hp<=0?"ko":""}">${hp<=0?"PINGSAN":hp}</span></td><td>🧪 ${g(x,"pot")} ✨ ${g(x,"rev")} ${esc(x.pet||"")}</td><td>${g(x,"lg")}</td><td>${g(x,"bt")}</td><td>${g(x,"wn")}</td><td>${g(x,"dt")}</td><td>${g(x,"ok")}/${g(x,"no")} (${acc})</td><td>${on?"🟢 ":""}${fmt(x.aks)}</td></tr>`}).join("");
show(`<h2>Dasbor guru</h2><p><small>Diperbarui otomatis saat pemain bermain. Titik hijau berarti aktif dalam 5 menit terakhir.</small></p><div class="cards">${cd.map(c=>`<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join("")}</div>
<div class="tw"><table><thead><tr><th>Akun</th><th>Pemain</th><th>Level</th><th>HP</th><th>Inventory</th><th>Login</th><th>Pertarungan</th><th>Menang</th><th>Mati</th><th>Benar/Salah</th><th>Terakhir aktif</th></tr></thead><tbody>${rows||'<tr><td colspan="11">Belum ada pemain yang login.</td></tr>'}</tbody></table></div>
<div class="row"><button class="btn gold" data-act="csv">Unduh rekap (CSV untuk Excel)</button><a class="btn alt" href="#main">Kembali ke game</a></div>`);app.style.maxWidth="1100px"}
async function csvSave(){const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const L=[["Akun","Nama di game","Level","HP","Potion","Revive","Peliharaan","Login","Pertarungan","Menang","Mati","Jawaban benar","Jawaban salah","Terakhir aktif"].map(q).join(",")];
LR.forEach(x=>L.push([(LP[x.id]&&LP[x.id].name)||"",x.nama,g(x,"lv"),g(x,"hp"),g(x,"pot"),g(x,"rev"),x.pet,g(x,"lg"),g(x,"bt"),g(x,"wn"),g(x,"dt"),g(x,"ok"),g(x,"no"),fmt(x.aks)].map(q).join(",")));
try{const dl=await claude.use("downloads");if(dl)await dl.save({filename:"rekap-petualang-hayati.csv",data:"\ufeff"+L.join("\r\n")})}catch(e){}}
function route(){if(unsub){unsub();unsub=null}clearTimeout(tm);if(location.hash==="#guru")guru();else S&&S.st?map():title()}
window.addEventListener("hashchange",route);
const hpUp=()=>{const h=document.getElementById("hh"),v=document.getElementById("hv");if(h)h.style.width=S.hp+"%";if(v)v.textContent=S.hp};
function bagDraw(){const g=document.getElementById("bag"),off=S.pot<1||B.php>=100||B.php<=0||B.mhp<=0;g.innerHTML=`<div class="item" style="margin-bottom:10px"><span class="em">🧪</span><div><b>Potion</b> <small>punya ${S.pot}</small><br><small>Memulihkan 50 HP. HP-mu sekarang ${B.php} dari 100.${S.pot<1?" Belum punya potion, beli di toko setelah pertarungan.":""}</small></div><button class="btn" data-act="bagpot" ${off?"disabled":""}>Pakai</button></div>`}
function fight(k){if(S.hp<=0){shop();return}const z=ZONES[k],ids=Q.map((q,i)=>i).filter(i=>Q[i].z===z.z).map(i=>{const s=S.st[i]||{c:0,w:0};return[i,s.c*2-s.w+Math.random()*1.5]}).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
S.bt=(S.bt||0)+1;B={z,q:ids,i:0,mhp:100,php:S.hp,mon:pick(z.mon),ok:0,streak:0,dmg:z.boss?20:34,hit:z.boss?25:20,done:false,miss:[]};draw()}

function draw(){const q=Q[B.q[B.i]],ord=[0,1,2,3].sort(()=>Math.random()-.5);B.done=false;
show(`${hud()}<div class="arena"><div class="f" id="pl"><div class="em">${S.av}</div><b>${esc(S.name)}</b><div class="bar hp" aria-label="Nyawa kamu"><i id="php" style="width:${B.php}%"></i></div></div><div class="vs">VS</div><div class="f mon" id="mo"><div class="em">${B.mon[0]}</div><b>${B.mon[1]}</b><div class="bar hp" aria-label="Nyawa monster"><i id="mhp" style="width:${B.mhp}%"></i></div></div></div>
<div class="row" style="margin:0 0 10px;justify-content:flex-end"><button class="btn alt" data-act="bag" aria-expanded="false">🎒 Tas (${S.pot} potion)</button></div><div id="bag"></div><section class="qc"><p class="q">${esc(q.q)}</p><div class="opts">${ord.map((o,j)=>`<button class="opt" data-act="ans" data-o="${o}"><kbd>${j+1}</kbd>${esc(q.o[o])}</button>`).join("")}</div><div id="fb" role="status" aria-live="polite"></div></section>`)}

function ans(o){if(B.done)return;B.done=true;const qi=B.q[B.i],q=Q[qi],st=S.st[qi]=S.st[qi]||{c:0,w:0},ok=o===q.a;let msg,bonus=0;
document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v===q.a)b.classList.add("ok");else if(v===o)b.classList.add("no")});
if(ok){st.c++;B.ok++;B.streak++;if(B.streak>=3)bonus=10;B.mhp=Math.max(0,B.mhp-B.dmg-bonus);msg=`✨ ${pick(SPELLS)}! Serangan tepat sasaran${bonus?` (kombo ${B.streak}x, bonus damage)`:""}.`;mo.classList.add("hit")}
else{st.w++;B.streak=0;B.php=Math.max(0,B.php-B.hit);if(B.php<=0)S.dt=(S.dt||0)+1;B.miss.push(qi);msg=`💥 ${B.mon[1]} menyerang balik! Jawaban yang benar: <b>${esc(q.o[q.a])}</b>`;pl.classList.add("hit")}
mhp.style.width=B.mhp+"%";php.style.width=B.php+"%";S.hp=B.php;hpUp();save();
const fin=B.mhp<=0||B.php<=0;
fb.innerHTML=`${msg}<div class="row"><button class="btn" data-act="${fin?"end":"next"}">${fin?"Lihat hasil":"Soal berikutnya"}</button></div>`;
fb.querySelector("button").focus()}

function end(){const z=B.z,win=B.mhp<=0,pre=S.lv;let xp=B.ok*8+(win?(z.boss?60:20):0),c=B.ok*3+(win?(z.boss?30:10):0);
S.xp+=xp;S.coins+=c;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++}if(win)S.w[z.z]=(S.w[z.z]||0)+1;save();
const k=ZONES.indexOf(z),miss=B.miss.slice(0,5).map(i=>`<div class="miss">${esc(Q[i].q)}<small>Jawaban: ${esc(Q[i].o[Q[i].a])}</small></div>`).join("");
show(`${hud()}<div class="end"><div class="em">${win?"🏆":"😵"}</div><h2>${win?B.mon[1]+" dikalahkan!":"Kamu pingsan, tapi belum kalah"}</h2><p>${B.ok} jawaban benar. Hadiah: <b>+${xp} XP</b> dan <b>+${c} koin</b>.</p><p>${S.hp<=0?"❤️ HP-mu habis. Gunakan Revive di toko untuk bangun kembali.":"❤️ HP tersisa "+S.hp+" dari 100. HP tidak pulih otomatis."}</p>
${S.lv>pre?`<div class="up">Naik ke level ${S.lv}!${pre<3&&S.lv>=3?" Gerbang Bos HOTS terbuka.":""}</div>`:""}
${miss?`<h2>Pelajari lagi</h2>${miss}`:""}
<div class="row" style="justify-content:center"><button class="btn" data-act="fight" data-k="${k}">Lawan lagi</button><button class="btn alt" data-act="map">Kembali ke peta</button></div></div>`)}

function shop(){show(`${hud()}<h2>Toko</h2><h2 style="font-size:20px">Obat dan revive</h2><div class="shop">${ITEMS.map(it=>`<div class="item"><span class="em">${it.e}</span><div><b>${it.n}</b> <small>punya ${S[it.k]}</small><br><small>${it.d}. Harga ${it.p} koin</small></div><button class="btn" data-act="buyi" data-k="${it.k}" ${S.coins<it.p?"disabled":""}>Beli</button><button class="btn alt" data-act="usei" data-k="${it.k}" ${S[it.k]<1||(it.k==="pot"?(S.hp<=0||S.hp>=100):S.hp>0)?"disabled":""}>Pakai</button></div>`).join("")}</div><h2 style="font-size:20px;margin-top:16px">Peliharaan</h2><div class="shop">${PETS.map(p=>{const own=S.own.includes(p.e),on=S.pet===p.e;return `<div class="item"><span class="em">${p.e}</span><div><b>${p.n}</b><br><small>${own?(on?"Sedang menemani kamu":"Sudah dimiliki"):p.p+" koin"}</small></div><button class="btn ${own?"alt":""}" data-act="buy" data-e="${p.e}" ${!own&&S.coins<p.p?"disabled":""}>${own?(on?"Lepas":"Pakai"):"Beli"}</button></div>`}).join("")}</div><div class="row"><button class="btn alt" data-act="map">Kembali ke peta</button></div>`)}

app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
if(a==="av"){tmpAv=b.dataset.a;const n=document.getElementById("nm").value;title();document.getElementById("nm").value=n}
else if(a==="start"){S={name:document.getElementById("nm").value.trim()||"Petualang",av:tmpAv,xp:0,lv:1,coins:0,st:{},w:{},own:[],pet:"",hp:100,pot:0,rev:0,lg:0,bt:0,dt:0};save();hello();map()}
else if(a==="fight")fight(+b.dataset.k);
else if(a==="ans")ans(+b.dataset.o);
else if(a==="next"){B.i++;if(B.i>=B.q.length)B.i=0;draw()}
else if(a==="end")end();
else if(a==="map")map();
else if(a==="shop")shop();
else if(a==="buy"){const p=PETS.find(x=>x.e===b.dataset.e);if(S.own.includes(p.e))S.pet=S.pet===p.e?"":p.e;else if(S.coins>=p.p){S.coins-=p.p;S.own.push(p.e);S.pet=p.e}save();shop()}
else if(a==="csv")csvSave();
else if(a==="bag"){const g=document.getElementById("bag");if(g.innerHTML){g.innerHTML="";b.setAttribute("aria-expanded","false")}else{b.setAttribute("aria-expanded","true");bagDraw()}}
else if(a==="bagpot"){if(S.pot>0&&B.php>0&&B.php<100&&B.mhp>0){S.pot--;B.php=Math.min(100,B.php+50);S.hp=B.php;save();document.getElementById("php").style.width=B.php+"%";hpUp();document.querySelector('[data-act="bag"]').textContent="🎒 Tas ("+S.pot+" potion)";bagDraw()}}
else if(a==="buyi"){const it=ITEMS.find(x=>x.k===b.dataset.k);if(S.coins>=it.p){S.coins-=it.p;S[it.k]++}save();shop()}
else if(a==="usei"){if(b.dataset.k==="pot"&&S.hp>0&&S.hp<100&&S.pot>0){S.pot--;S.hp=Math.min(100,S.hp+50)}else if(b.dataset.k==="rev"&&S.hp<=0&&S.rev>0){S.rev--;S.hp=50}save();shop()}
else if(a==="reset"){if(!sure){sure=true;b.textContent="Yakin? Klik sekali lagi";return}try{localStorage.removeItem(K)}catch(e){}S=null;title()}});
document.addEventListener("keydown",e=>{if(!B||B.done||!/^[1-4]$/.test(e.key))return;const o=document.querySelectorAll(".opt")[+e.key-1];if(o&&!o.disabled)o.click()});
route();
</script>
</body>
</html>
